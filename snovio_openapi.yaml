      tags: [Aquecimento de E-mail]
      description: Este método retorna estatísticas diárias e por provedor de entregabilidade de uma campanha de aquecimento — seja em uma janela predefinida ( two_weeks / month ) ou um intervalo de datas personalizado. Útil para monitorar o progresso da taxa de caixa de entrada e identificar provedores onde o aquecimento está tendo baixo desempenho.
