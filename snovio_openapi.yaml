                  description: Novo endereço de e-mail de resposta (reply-to). Passe null para limpar.
                limitation:
                  type: string
                  description: "Novo limite diário de envios. Inteiro, mín. 1 , máx. 1200 . Não pode exceder a quantidade máxima de e-mails que a conta poderia enviar em 24 horas considerando o delay configurado."
                delay_type:
                  type: string
                  enum: [fixed, random]
                  description: "Novo tipo de delay. Valores permitidos: fixed , random ."
                delay_fixed:
                  type: string
                  description: "Delay fixo em segundos (usado quando delay_type=fixed ). Inteiro, mín. 5 , máx. 3600 ."
                delay_from:
                  type: string
                  description: "Delay mínimo em segundos (usado quando delay_type=random ). Inteiro, mín. 5 , máx. 3600 ."
                delay_to:
                  type: string
                  description: "Delay máximo em segundos (usado quando delay_type=random ). Inteiro, mín. 5 , máx. 3600 , deve ser maior que delay_from ."
                signature:
                  type: string
                  description: Nova assinatura HTML. Passe null para limpar.
                bcc_email:
                  type: string
                  description: Novo endereço de e-mail BCC. Passe null para limpar.
                tags:
                  type: array
                  items:
                    type: string
                  description: Novo array de tags. Substitui completamente a lista de tags atual. Passe null para remover todas as tags.
                timezoneId:
