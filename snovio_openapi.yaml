  /v2/campaigns/create:
    post:
      operationId: CreateCampaign
      summary: Este método cria uma nova campanha de prospecção no seu workspace do snov.io
      tags: [Campanhas Multicanal]
      description: "Este método cria uma nova campanha de prospecção no seu workspace do snov.io. A campanha é criada com o status new e pode ser salva em qualquer estado parcialmente configurado — apenas os campos necessários para uma campanha executável são validados como obrigatórios; os demais podem ser preenchidos posteriormente. São suportadas sequências exclusivamente por e-mail, exclusivamente pelo LinkedIn e sequências multicanal mistas, incluindo variantes A/B, triggers (abertura, clique, resposta, calendly, nível de conexão, in-mail enviado no LinkedIn, etc.), atrasos e blocos de objetivo. Este método cria uma campanha sem conteúdo nos blocos de mensagem. O conteúdo é adicionado posteriormente, chamando o método Create Email Step Content ."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: String. Nome de exibição da campanha. Máximo de 255 caracteres.
                priority:
                  type: string
                  description: "Enum de string. Prioridade de envio da campanha: low , medium , high ."
                email_accounts:
                  type: array
                  items:
                    type: integer
                  description: Array de inteiros. IDs das contas de remetente de e-mail a serem utilizadas.
                  x-condition: campanhas de e-mail
                linkedin_accounts:
                  type: array
                  items:
                    type: integer
                  description: Array de inteiros. IDs das contas do LinkedIn a serem utilizadas.
                tracking:
                  type: object
                  description: Objeto. Configurações de rastreamento de e-mail.
                  x-condition: campanhas de e-mail
                tracking.open:
                  type: boolean
                  description: Booleano. Rastrear aberturas de e-mail.
                tracking.link_click:
                  type: boolean
                  description: Booleano. Rastrear cliques em links nos e-mails.
                sending_settings:
                  type: object
                  description: Objeto. Controla como os e-mails são enviados e quais destinatários são ignorados.
                  x-condition: campanhas de e-mail
                sending_settings.sending_priority:
                  type: string
                  description: "Enum de string. Quais e-mails têm prioridade: first_email ou follow_up ."
                sending_settings.daily_sending_all:
                  type: integer
                  description: Inteiro ou null . Máximo total de e-mails enviados por dia para todos os destinatários.
                sending_settings.daily_sending_new_recipients:
                  type: integer
                  description: Inteiro ou null . Máximo de novos destinatários contatados por dia.
                sending_settings.skip_unverifiable:
                  type: boolean
                  description: Booleano. Ignorar destinatários cujo e-mail não pode ser verificado.
                sending_settings.skip_unverified:
                  type: boolean
                  description: Booleano. Ignorar destinatários com e-mails não verificados.
                sending_settings.skip_who_replied:
                  type: string
                  description: Interromper o acompanhamento de prospects que responderam.
                sending_settings.skip_company_domain_who_replied:
                  type: boolean
                  description: Booleano. Ignorar destinatários de um domínio de empresa onde alguém respondeu.
                sending_settings.skip_recipients_without_variables_data:
                  type: boolean
                  description: Booleano. Ignorar destinatários sem valores de variáveis personalizadas.
                sending_settings.skip_other_recipients_email_addresses:
                  type: boolean
                  description: "Booleano. Se o prospect tiver vários endereços de e-mail, enviar apenas para o primeiro se o valor for true ."
                sending_settings.skip_recipients_added_to_my_another_campaign:
                  type: boolean
                  description: Booleano. Ignorar destinatários que já estão em outra campanha deste usuário.
                sending_settings.skip_recipients_added_to_team_another_campaign:
                  type: boolean
                  description: Booleano. Ignorar destinatários que já estão em outra campanha de qualquer membro da equipe.
                sending_settings.one_click_unsubscribe:
                  type: boolean
                  description: Booleano. Ativar cabeçalho de cancelamento de assinatura com um clique nos e-mails.
                recipients:
                  type: object
                  description: Objeto. Define quem recebe a campanha.
                recipients.list_id:
                  type: integer
                  description: Inteiro. ID da lista de prospects para envio.
                recipients.black_list_id:
                  type: integer
                  description: Integer. ID da lista de não envio. Consulte Ver todas as Listas de não envio de e-mails .
                schedule_id:
                  type: integer
                  description: Integer. ID do programa de envio. Consulte Ver todos os agendamentos .
                start_campaign_at:
                  type: string
                  format: date-time
                  description: "String ( YYYY-MM-DD HH:MM:SS ) ou null . Data e hora em que a campanha deve iniciar automaticamente, ex.: 2027-03-25 09:00:00 ."
                complete_campaign_at:
                  type: string
