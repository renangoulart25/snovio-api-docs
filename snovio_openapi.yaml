        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Integer. ID da campanha de aquecimento a ser atualizada.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, paused, completed, deleted]
                  description: "Alterar manualmente o status da campanha. Valores permitidos: active , paused , completed , deleted ."
                strategy:
                  type: string
                  description: "Nova estratégia de envio: progressive ou steady ."
                per_day:
                  type: string
                  description: Nova meta de envio diário. Intervalo 1 – 1000 dependendo do plano.
                from:
                  type: string
                  description: Novo volume diário inicial. Intervalo 1 – 10 . Obrigatório quando strategy=progressive .
                increase:
                  type: string
                  description: Novo aumento diário de volume. Intervalo 1 – 5 . Obrigatório quando strategy=progressive .
                email_content:
                  type: string
                  description: "Tipo de conteúdo do e-mail: autogenerated ou specific ."
                subject:
                  type: string
                  description: "Novo assunto do e-mail, 1–200 caracteres. Obrigatório quando email_content=specific ."
                body:
                  type: string
                  description: "Novo corpo do e-mail, 1–10000 caracteres. Obrigatório quando email_content=specific ."
                reply_rate:
                  type: string
                  description: Novo percentual de taxa de resposta. Intervalo 10 – 45 .
                campaign_deadline:
                  type: string
                  description: Nova data de término da campanha ( YYYY-MM-DD ).
                make_endless:
                  type: boolean
                  description: Boolean. Passe true para remover o campaign_deadline atual e tornar a campanha sem prazo.
                providers:
                  type: string
                  description: Novos provedores destinatários alvo (mesmos valores permitidos que em Criar campanha de aquecimento).
                send_to_paid_domain:
                  type: boolean
                  description: Boolean.
                enable_ctd:
                  type: boolean
                  description: Boolean. Ativar ou desativar o domínio de rastreamento personalizado.
                enable_proxy:
                  type: boolean
                  description: Boolean. Ativar ou desativar o proxy dinâmico.
                schedule_id:
                  type: string
                  description: Novo ID de agendamento de envio.
                template_name:
                  type: string
                  description: Novo nome do modelo.
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                  success:
                    type: boolean
              example:
                data:
                  id: 123
                success: true
