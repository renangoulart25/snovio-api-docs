    patch:
      operationId: UpdateWarmUp
      summary: Este método atualiza parcialmente uma campanha de aquecimento existente
      tags: [Aquecimento de E-mail]
      description: "Este método atualiza parcialmente uma campanha de aquecimento existente. Apenas os campos passados serão alterados; todas as outras configurações permanecem inalteradas. Use este método para alterar as configurações da campanha em tempo real, mudar o status ( active , paused , completed , deleted ), ou remover o prazo enviando make_endless: true ."
