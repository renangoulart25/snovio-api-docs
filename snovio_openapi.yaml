                  type: string
                  description: "Lista de departamentos para incluir na busca. Opções possíveis: engineering, human_resources, it_is, finance_administration, marketing, operations, sales, support, other."
                filters.prospect.departments.exclude:
                  type: string
                  description: "Lista de departamentos para excluir da busca. Opções possíveis: engineering, human_resources, it_is, finance_administration, marketing, operations, sales, support, other."
                filters.prospect.locations.include.locality:
                  type: string
                  description: "Localizações para incluir, p. ex. Londres Se nenhuma correspondência for encontrada, a API retornará até 15 opções similares."
                filters.prospect.locations.include.location_type:
                  type: string
                  description: "Tipos de localização para incluir. Opções possíveis: city, state, country, region, subregion."
                filters.prospect.locations.exclude.locality:
                  type: string
                  description: "Localizações para excluir, p. ex. Atlanta Se nenhuma correspondência for encontrada, a API retornará até 15 opções similares."
                filters.prospect.locations.exclude.location_type:
                  type: string
                  description: "Tipos de localização a excluir. Opções possíveis: cidade, estado, país, região, sub-região."
                filters.prospect.skills.include:
                  type: string
                  description: Lista de habilidades do prospect que você deseja incluir na pesquisa.
                filters.prospect.skills.exclude:
                  type: string
                  description: Lista de habilidades do prospect que você deseja excluir.
                filters.prospect.first_name:
                  type: string
                  description: Nome do prospect.
                filters.prospect.last_name:
                  type: string
                  description: Sobrenome do prospect.
                filters.company.name.include:
                  type: string
                  description: Lista de nomes de empresas a incluir.
                filters.company.name.exclude:
                  type: string
                  description: Lista de nomes de empresas a excluir.
                filters.company.locations.include.locality:
                  type: string
                  description: "Localizações da empresa a incluir, ex. Londres Se nenhuma correspondência for encontrada, a API retorna uma lista com resultados similares."
                filters.company.locations.include.location_type:
                  type: string
                  description: "Tipos de localização da empresa a incluir. Opções possíveis: cidade, estado, país, região, sub-região."
                filters.company.locations.exclude.locality:
                  type: string
                  description: "Localizações da empresa para excluir, ex: Atlanta Se nenhuma correspondência for encontrada, a API retorna uma lista com resultados similares."
                filters.company.locations.exclude.location_type:
                  type: string
                  description: "Tipos de localização da empresa para excluir. Opções possíveis: city, state, country, region, subregion."
                filters.company.industries.include:
                  type: string
                  description: "Lista de setores para incluir. Se nenhuma correspondência for encontrada, a API retorna uma lista com resultados similares."
                filters.company.industries.exclude:
                  type: string
                  description: "Lista de setores para excluir. Se nenhuma correspondência for encontrada, a API retorna uma lista com resultados similares."
                filters.company.size:
                  type: string
                  description: "Faixa de tamanho da empresa. Opções possíveis: Self, 1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5001-10000, 10001+"
                filters.company.revenue.min:
                  type: string
                  description: "Receita mínima da empresa. Opções possíveis: 0, 1, 500000, 1000000, 2500000, 5000000, 10000000, 20000000, 50000000, 100000000, 500000000, 1000000000 Atenção: a receita mínima não pode exceder a receita máxima definida."
                filters.company.revenue.max:
                  type: string
                  description: "Receita máxima da empresa. Opções possíveis: 0, 1, 500000, 1000000, 2500000, 5000000, 10000000, 20000000, 50000000, 100000000, 500000000, 1000000000, 1000000000000"
                filters.company.specialities:
                  type: string
