      operationId: DatabaseSearch
      summary: Pesquise prospects e empresas no banco de dados
      tags: [Localizador de E-mails]
      description: "Pesquise prospects e empresas no banco de dados. Use filtros para refinar sua busca. **Buscar prospects (solicitando resultados)** > Grátis (limitado a 1 página de resultados para contas Snov.io gratuitas)"
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters.prospect.job_titles.include:
                  type: string
                  description: Lista de cargos que você deseja incluir.
                filters.prospect.job_titles.exclude:
                  type: string
                  description: Lista de cargos para excluir.
                filters.prospect.management_levels.include:
