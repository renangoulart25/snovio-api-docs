  /v1/add-prospect-to-list:
    post:
      operationId: AddProspectToList
      summary: Adicione um cliente potencial a uma lista específica
      tags: [Gerenciamento de Prospects]
      description: "Adicione um cliente potencial a uma lista específica. Esse método será útil para quem deseja automatizar a adição de clientes potenciais às listas com campanhas de automação de email ativas. Dessa forma, após um cliente potencial ser adicionado automaticamente a uma lista escolhida, uma campanha de automação de email será iniciada automaticamente."
      x-credits: Gratuito
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: O endereço de email do cliente potencial.
                fullName:
                  type: string
                  description: O nome completo do cliente potencial.
                firstName:
                  type: string
                  description: O nome do cliente potencial.
                lastName:
                  type: string
                  description: O sobrenome do cliente potencial.
                phones:
                  type: string
                  description: Matriz com os números de telefone do cliente potencial.
                country:
                  type: string
                  description: O país do cliente potencial. Os nomes dos países são definidos aqui . Use apenas países desta lista.
                locality:
                  type: string
                  description: O local do cliente potencial.
                position:
                  type: string
                  description: O cargo do cliente potencial.
                companyName:
                  type: string
                  description: O nome da empresa do cliente potencial.
                companySite:
                  type: string
                  description: "O site da empresa do cliente potencial. Use o http://example.com formato."
                updateContact:
                  type: string
                  description: "Atualiza um cliente potencial existente. Aceita true ou false . Se true e já existir um cliente potencial com este endereço de e-mail em uma das listas, o sistema atualizará o perfil existente. Se false , o sistema não atualizará o perfil existente."
                createDuplicates:
                  type: string
                  description: "Cria um cliente potencial duplicado. Aceita true ou false . Se true e já existir um cliente potencial com este endereço de e-mail em uma das listas, o sistema criará um perfil duplicado. Se false , o sistema não criará um perfil duplicado. Apenas um parâmetro, updateContact ou createDuplicates , pode ser definido como true ."
                customFields[specialization]:
                  type: string
                  description: "Você pode adicionar valores personalizados aos campos personalizados criados anteriormente. Para isso, especifique o nome do campo personalizado em [brackets]."
                socialLinks[linkedIn]:
                  type: string
                  description: "Um link para o perfil de mídias sociais do cliente potencial. Especifique o nome da rede social entre [colchetes] (LinkedIn, Facebook ou X)."
                  x-condition: email is null
                listId:
                  type: string
                  description: O identificador da lista ao qual o cliente potencial pertence.
              required: ["socialLinks[linkedIn]", listId]
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  added:
                    type: boolean
                  updated:
                    type: boolean
              example:
                success: true
                id: 0Y2QzowWL1rHpIptwaRp0Q==
                added: true
                updated: false
