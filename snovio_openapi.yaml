  /v2/warm-up:
    post:
      operationId: CreateWarmUp
      summary: Este método cria e inicia uma nova campanha de aquecimento para a conta de e-mail especificada
      tags: [Aquecimento de E-mail]
      description: "Este método cria e inicia uma nova campanha de aquecimento para a conta de e-mail especificada. O aquecimento melhora gradualmente a reputação de envio da conta trocando e-mails curtos com uma rede selecionada de destinatários. Escolha a estratégia progressive para aumentar o volume diário a partir de um ponto inicial pequeno, ou a estratégia steady para enviar um número fixo de e-mails de aquecimento por dia; forneça seu próprio subject e body ou deixe o snov.io gerá-los automaticamente."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_account_id:
                  type: integer
                  description: Integer. ID da conta de e-mail a ser aquecida.
                strategy:
                  type: string
                  enum: [progressive, steady]
                  description: "Estratégia de envio. Valores permitidos: progressive , steady . Padrão: progressive ."
                per_day:
                  type: integer
                  description: Integer. Meta de envio diário. Intervalo 1 – 1000 dependendo do plano.
                from:
                  type: integer
                  description: "Integer. Volume diário inicial (apenas estratégia progressive ). Intervalo 1 – 5 , deve ser ≤ per_day . Obrigatório quando strategy=progressive ."
                increase:
                  type: integer
                  description: Integer. Aumento diário de volume (apenas estratégia progressive ). Intervalo 1 – 5 . Obrigatório quando strategy=progressive .
                email_content:
                  type: string
                  enum: [autogenerated (gerado por ia), specific (personalizado)]
                  description: "Tipo de conteúdo do e-mail. Valores permitidos: autogenerated (gerado por IA), specific (personalizado). Padrão: autogenerated ."
                subject:
                  type: string
                  description: "String. Assunto do e-mail, 1–200 caracteres. Obrigatório quando email_content=specific ."
                body:
                  type: string
                  description: "String. Corpo do e-mail, 1–10000 caracteres. Obrigatório quando email_content=specific ."
                reply_rate:
                  type: integer
                  description: "Integer. Percentual de e-mails de aquecimento recebidos que serão respondidos. Intervalo 10 – 45 . Padrão: 30 ."
                campaign_deadline:
                  type: string
                  format: date
                  description: String ( YYYY-MM-DD ). Data em que o aquecimento deve parar. Omita para sem prazo.
                providers:
                  type: array
                  items:
                    type: string
                  description: "Array de strings. Provedores destinatários alvo. Valores permitidos: gmail , microsoft , other ."
                send_to_paid_domain:
                  type: boolean
                  description: "Boolean. Se deve enviar para domínios pagos. Padrão: false ."
                enable_ctd:
                  type: boolean
                  description: "Boolean. Ativar domínio de rastreamento personalizado. Padrão: false ."
                enable_proxy:
                  type: boolean
                  description: "Boolean. Ativar proxy dinâmico. Padrão: false ."
                schedule_id:
                  type: integer
                  description: Integer. ID de um agendamento de envio a ser anexado ao aquecimento.
                template_name:
                  type: string
                  description: String. Nome de um modelo de e-mail salvo para usar.
              required: [email_account_id, per_day]
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                  success:
                    type: boolean
              example:
                data:
                  id: 123
                success: true
    get:
      operationId: GetWarmUpList
      summary: "Este método retorna uma lista paginada de todas as campanhas de aquecimento na conta, opcionalmente filtradas por status"
      tags: [Aquecimento de E-mail]
      description: "Este método retorna uma lista paginada de todas as campanhas de aquecimento na conta, opcionalmente filtradas por status. Cada item tem a mesma estrutura que a resposta de Obter informações da campanha de aquecimento ."
