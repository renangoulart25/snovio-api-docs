    patch:
      operationId: UpdateCampaign
      summary: Este método atualiza parcialmente uma campanha de outreach existente no seu workspace do snov.io
      tags: [Campanhas Multicanal]
      description: "Este método atualiza parcialmente uma campanha de outreach existente no seu workspace do snov.io. Apenas os campos incluídos no corpo da requisição são alterados; os campos omitidos permanecem inalterados. Objetos aninhados ( tracking , sending_settings , recipients , deals ) também são mesclados — enviar {\"tracking\": {\"open\": false}} não limpa link_click . O corpo aceito tem a mesma estrutura que Create campaign, portanto qualquer subconjunto de title , priority , email_accounts , linkedin_accounts , tracking , sending_settings , recipients , schedule_id , start_campaign_at , complete_campaign_at , timezone , complete_campaign_after_last_step , archive_in_months , provider_matching , sequence e deals pode ser enviado. Configurações principais (marcadas com (core) abaixo) são editáveis apenas enquanto a campanha está no estado new (rascunho) — elas são bloqueadas assim que a campanha passa para paused , active , scheduled , completed ou archived . Quando sequence é fornecido, o array substitui completamente o fluxograma existente. Etapas cujo _ref corresponde a um ID de etapa numérico existente são atualizadas no lugar; etapas com um _ref não numérico são criadas como novas; quaisquer etapas existentes ausentes do array são excluídas."
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
          description: Inteiro. ID da campanha a ser atualizada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: String. Nome de exibição da campanha. Máximo de 255 caracteres.
                priority:
                  type: string
                  description: "String enum. Prioridade de envio: low , medium , high ."
                email_accounts:
                  type: array
                  items:
                    type: integer
                  description: Array de inteiros. IDs das contas de remetente de e-mail. Contas de e-mail não podem ser adicionadas se a campanha ativa não contiver etapas de e-mail.
                linkedin_accounts:
                  type: array
                  items:
                    type: integer
                  description: Array de inteiros. IDs das contas do LinkedIn. Contas do LinkedIn não podem ser adicionadas se a campanha ativa não contiver etapas do LinkedIn.
                provider_matching:
                  type: boolean
                  description: Booleano. Corresponder o provedor de e-mail do destinatário ao provedor da conta remetente. Sempre false para campanhas somente do LinkedIn.
                complete_campaign_after_last_step:
                  type: boolean
                  description: Booleano. Encerrar a campanha quando todos os destinatários passarem pela última etapa da sequência.
                archive_in_months:
                  type: integer
                  description: "Inteiro. Arquivar automaticamente após esta quantidade de meses. Valores permitidos: 1 , 2 , 3 , 6 ."
                schedule_id:
                  type: integer
                  description: Inteiro ou null . ID do cronograma de envio. Um ID inexistente retorna 404 / 422 .
                start_campaign_at:
                  type: string
                  format: date-time
                  description: "String ( YYYY-MM-DD HH:MM:SS ) ou null . Data e hora em que a campanha deve iniciar automaticamente. Não pode ser adicionado se o campo estava ausente na criação; null não tem efeito (o valor existente não é apagado)."
                complete_campaign_at:
                  type: string
                  format: date-time
                  description: "String ( YYYY-MM-DD HH:MM:SS ) ou null . Data e hora em que a campanha deve ser encerrada automaticamente. Deve ser posterior a start_campaign_at . null não tem efeito."
                timezone:
                  type: string
                  description: "String ou null . Fuso horário usado para campos de data; aceita identificadores de fuso horário IANA no formato Region/City , ex.: America/New_York . Só tem efeito quando start_campaign_at está presente na campanha."
                recipients (core):
                  type: object
                  description: "Objeto. Configuração de destinatários. Bloqueado em campanhas iniciadas, editável no rascunho."
                recipients.list_id (core):
                  type: integer
                  description: Inteiro. ID da lista de prospects.
                recipients.black_list_id (core):
                  type: integer
                  description: Inteiro ou null . ID da lista negra a ser excluída.
                tracking:
                  type: object
                  description: Objeto. Configurações de rastreamento de e-mail. Ignorado para campanhas somente do LinkedIn.
                tracking.open:
                  type: boolean
                  description: Booleano. Rastrear aberturas de e-mail.
                tracking.link_click:
                  type: boolean
                  description: Booleano. Rastrear cliques em links nos e-mails.
                sending_settings:
                  type: object
                  description: Objeto. Controla como os e-mails são enviados e quais destinatários são ignorados.
                sending_settings.sending_priority:
                  type: string
                  description: "String enum. Quais e-mails têm prioridade: first_email ou follow_up ."
                sending_settings.daily_sending_all:
                  type: integer
                  description: Inteiro ou null . Máximo de e-mails enviados por dia para todos os destinatários. null remove o limite.
                sending_settings.daily_sending_new_recipients:
                  type: integer
                  description: Inteiro ou null . Máximo de novos destinatários contatados por dia. null remove o limite.
                sending_settings.skip_who_replied:
                  type: boolean
                  description: Booleano. Interromper follow-ups para prospects que respondam.
                sending_settings.skip_company_domain_who_replied:
                  type: boolean
                  description: Booleano. Ignorar destinatários do domínio de uma empresa onde alguém respondeu.
                sending_settings.skip_unverifiable (core):
                  type: boolean
                  description: Booleano. Ignorar destinatários cujo e-mail não pode ser verificado. Bloqueado em campanhas iniciadas.
                sending_settings.skip_unverified (core):
                  type: boolean
                  description: Booleano. Ignorar destinatários com e-mails não verificados. Bloqueado em campanhas iniciadas.
                sending_settings.skip_other_recipients_email_addresses (core):
                  type: boolean
                  description: "Booleano. Se o prospect tiver vários endereços de e-mail, enviar apenas para o primeiro se for true . Bloqueado em campanhas iniciadas."
                sending_settings.skip_recipients_added_to_my_another_campaign (core):
                  type: boolean
                  description: Booleano. Ignorar destinatários já em outra campanha deste usuário. Bloqueado em campanhas iniciadas.
                sending_settings.skip_recipients_added_to_team_another_campaign (core):
                  type: boolean
                  description: Booleano. Ignorar destinatários em outra campanha de qualquer membro da equipe. Bloqueado em campanhas iniciadas.
                sending_settings.skip_recipients_without_variables_data:
                  type: boolean
                  description: Booleano. Ignorar destinatários sem valores para variáveis personalizadas.
                sending_settings.one_click_unsubscribe:
                  type: boolean
                  description: Booleano. Ativar cabeçalho de cancelamento de assinatura com um clique nos e-mails.
                deals:
                  type: object
                  description: Objeto ou null . Configurações de criação de deals no CRM. Passe null para remover a configuração de deals.
                deals.event:
                  type: array
                  items:
                    type: string
                  description: "Array de strings. Eventos que criam um deal: open , click , reply ."
                  x-condition: deals
                deals.pipeline_id:
                  type: integer
                  description: Inteiro. ID do pipeline do CRM.
                  x-condition: deals
                deals.stage_id:
                  type: integer
                  description: Inteiro. ID da etapa do pipeline.
                  x-condition: deals
                deals.potential_value:
                  type: integer
                  description: Inteiro. Valor estimado do deal. Deve ser positivo.
                deals.currency:
                  type: string
                  description: "String. Código da moeda para o valor do deal, ex.: USD , EUR ."
                sequence:
                  type: object
                  description: "Objeto. Substituição completa da sequência da campanha — quando fornecido, substitui todo o fluxograma."
                sequence.entry:
                  type: string
                  description: String. _ref da primeira etapa a ser executada.
                  x-condition: sequence
                sequence.steps:
                  type: array
                  items:
                    type: string
                  description: Array de objetos de etapas. Lista completa de etapas.
                  x-condition: sequence
                sequence.steps._ref:
                  type: string
                  description: String. Identificador da etapa. Um _ref numérico atualiza uma etapa existente; um _ref não numérico cria uma nova etapa.
                sequence.steps.type:
                  type: string
                  description: "String enum. Tipo de etapa: email , delay , trigger , goal , linkedin . Não pode ser alterado em etapas existentes (numérico _ref )."
                sequence.steps.next:
                  type: string
                  description: "String ou null . _ref da etapa para avançar após esta (blocos lineares: email , linkedin , delay )."
                sequence.steps.yes:
                  type: string
                  description: String. _ref da etapa para ir quando a condição do trigger é atendida (somente trigger ).
                sequence.steps.no:
                  type: string
                  description: String. _ref da etapa para ir quando a condição do trigger não é atendida (somente trigger ).
                sequence.steps.waiting_type:
                  type: string
                  description: "String enum. Unidade de tempo: minutes , hours , days ."
                  x-condition: delay / trigger
                sequence.steps.waiting_val:
                  type: integer
                  description: "Inteiro. Número de unidades de tempo a aguardar. Mín 1 para etapas delay e trigger . Limites por unidade: minutes ≤ 43200 , hours ≤ 720 , days ≤ 30 ."
                  x-condition: delay / trigger
                sequence.steps.action:
                  type: string
                  description: String enum. Ação a ser executada ou evento a ser monitorado. Veja os valores suportados abaixo.
                  x-condition: linkedin / trigger
                sequence.steps.goal_name:
                  type: string
                  description: "String. Rótulo para esta etapa de objetivo, ex.: Replied , Connected . Um bloco goal deve ser a última etapa em seu ramo — não pode ter next e não pode ser a primeira etapa da sequência."
                  x-condition: goal
                sequence.steps.content_slots:
                  type: integer
                  description: "Inteiro (mín 1 , máx 15 ). Número de variantes de conteúdo A/B."
                  x-condition: email
                sequence.steps.content:
                  type: array
                  items:
                    type: string
                  description: "Array de objetos. Metadados de conteúdo copiados da resposta GET; cada item: {\"id\": <int>, \"plain_text\": <bool>, \"usage\": \"active\"} ."
                  x-condition: email ao atualizar etapas existentes
                sequence.steps.subject:
                  type: string
                  description: "String ou null . Assunto do e-mail ou InMail; suporta {{variables}} . Opcional para email ; obrigatório para etapa linkedin com action=in_mail ."
                sequence.steps.body:
                  type: string
                  description: String (HTML). Corpo da mensagem para ações do LinkedIn que enviam texto.
                  x-condition: invite / message / in_mail
                sequence.steps.value:
                  type: array
                  items:
                    type: integer
                  description: Inteiro ( 1 – 5 ) para endorse_skills ; array de inteiros (níveis de grau válidos) para trigger check_connection_level .
                  x-condition: endorse_skills / check_connection_level
              required: [deals.event, deals.pipeline_id, deals.stage_id, sequence.entry, sequence.steps, sequence.steps._ref, sequence.steps.type, sequence.steps.waiting_type, sequence.steps.waiting_val, sequence.steps.action, sequence.steps.goal_name, sequence.steps.content_slots, sequence.steps.content, sequence.steps.body, sequence.steps.value]
