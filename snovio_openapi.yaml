openapi: 3.1.0
info:
  title: Snov.io REST API
  version: 2026-09-16
  description: "Especificação machine-readable da REST API da Snov.io. Gerada automaticamente a partir da documentação oficial (https://snov.io/br/api). Rate limit: 60 req/min."
  contact:
    name: Snov.io
    url: "https://snov.io"
servers:
  - url: "https://api.snov.io"
    description: Produção
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 Access Token
      description: "Obtenha um token via POST /v1/oauth/access_token com grant_type=client_credentials, client_id e client_secret. Token expira em 3600s."
tags:
  - name: Autenticação
    description: Autenticação OAuth2 para obter tokens de acesso.
  - name: Localizador de E-mails
    description: Endpoints de Localizador de E-mails da API Snov.io.
  - name: Verificador de E-mails
    description: Endpoints de Verificador de E-mails da API Snov.io.
  - name: Conta de E-mail
    description: Endpoints de Conta de E-mail da API Snov.io.
  - name: Aquecimento de E-mail
    description: Endpoints de Aquecimento de E-mail da API Snov.io.
  - name: Campanhas Multicanal
    description: Endpoints de Campanhas Multicanal da API Snov.io.
  - name: Gerenciamento de Prospects
    description: Endpoints de Gerenciamento de Prospects da API Snov.io.
  - name: CRM
    description: Endpoints de CRM da API Snov.io.
  - name: Conta do Usuário
    description: Endpoints de Conta do Usuário da API Snov.io.
  - name: Webhooks
    description: Endpoints de Webhooks da API Snov.io.
paths:
  /v1/oauth/access_token:
    post:
      operationId: OAuthAccessToken
      summary: Obter token de acesso OAuth
      tags: [Autenticação]
      description: "Gera um token de acesso para autenticar solicitações futuras. Especifique o token no campo Authorization: Bearer {token}."
      x-credits: Gratuito
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                  description: Sempre client_credentials
                client_id:
                  type: string
                  description: "Seu ID disponível em https://app.snov.io/account/api"
                client_secret:
                  type: string
                  description: "Sua chave secreta disponível em https://app.snov.io/account/api"
              required: [grant_type, client_id, client_secret]
      responses:
        200:
          description: Token gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Novo token de acesso
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    description: Expiração em segundos
                    example: 3600
              example:
                access_token: 3yUyQZdks0Ej7T2fXzjUWzwlTcO4dWisKkeMpESz
                token_type: Bearer
                expires_in: 3600
  /v2/domain-search/start:
    post:
      operationId: DomainSearch2
      summary: "Enter a domain name and Snov.io will return company info, emails and prospect profiles"
      tags: [Localizador de E-mails]
      description: "Enter a domain name and Snov.io will return company info, emails and prospect profiles. **Custo em créditos** **Solicitações de informações da empresa, e-mails e perfis de clientes potenciais** 1 crédito por solicitação POST. Não cobraremos você se não houver resultados. **E-mails de perfis de clientes potenciais** 1 crédito por perfil de cliente potencial com e-mail. **Informações da empresa (solicitar resultados)**"
      x-credits: 1 crédito por solicitação distinta.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: "O nome do domínio para o qual você deseja localizar e-mails da empresa. Por exemplo, \"snov.io\"."
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      domain:
                        type: string
                      task_hash:
                        type: string
                  links:
                    type: object
                    properties:
                      result:
                        type: string
              example:
                data: []
                meta:
                  domain: snov.io
                  task_hash: 6f15de14db954c761f8e7507547b3bd7
                links:
                  result: "https://api.snov.io/v2/domain-search/result/6f15de14db954c761f8e7507547b3bd7"
  /v2/domain-search/result/{task_hash}:
    get:
      operationId: DomainSearch2_informacoes_da_empresa_obter_resultados
      summary: Informações da empresa (obter resultados)
      tags: [Localizador de E-mails]
      x-credits: 1 crédito por solicitação distinta.
      security:
        - bearerAuth: []
      parameters:
        - name: task_hash
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      company_name:
                        type: string
                      city:
                        type: string
                      founded:
                        type: string
                      website:
                        type: string
                      hq_phone:
                        type: string
                      industry:
                        type: string
                      size:
                        type: string
                      related_domains:
                        type: array
                        items:
                          type: string
                  meta:
                    type: object
                    properties:
                      domain:
                        type: string
                      task_hash:
                        type: string
                      prospects_count:
                        type: integer
                      emails_count:
                        type: integer
                      generic_contacts_count:
                        type: integer
                  links:
                    type: object
                    properties:
                      prospects:
                        type: string
                      domain_emails:
                        type: string
                      generic_contacts:
                        type: string
                  status:
                    type: string
              example:
                data:
                  company_name: Snov.io
                  city: New York
                  founded: 2017
                  website: snov.io
                  hq_phone: 13477050819
                  industry: Computer Software
                  size: 51-200
                  related_domains: [snov.me]
                meta:
                  domain: snov.io
                  task_hash: 6f15de14db954c761f8e7507547b3bd7
                  prospects_count: 196
                  emails_count: 108
                  generic_contacts_count: 9
                links:
                  prospects: "https://api.snov.io/v2/domain-search/prospects/start?domain=snov.io"
                  domain_emails: "https://api.snov.io/v2/domain-search/domain-emails/start?domain=snov.io"
                  generic_contacts: "https://api.snov.io/v2/domain-search/generic-contacts/start?domain=snov.io"
                status: completed
