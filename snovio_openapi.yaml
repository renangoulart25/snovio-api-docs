  /v2/sender-accounts/emails:
    post:
      operationId: AddEmailAccount
      summary: Este método conecta uma nova conta de e-mail SMTP/IMAP ao seu workspace da snov.io para que ela possa ser usada como rem
      tags: [Conta de E-mail]
      description: Este método conecta uma nova conta de e-mail SMTP/IMAP ao seu workspace da snov.io para que ela possa ser usada como remetente em campanhas. A conta é criada mesmo que a verificação da conexão SMTP/IMAP ainda não tenha sido concluída — o status da conexão é retornado de forma assíncrona nos campos smtp.status / imap.status e pode ser consultado posteriormente. Apenas contas SMTP/IMAP (tipo de provedor other ) são suportadas; os fluxos OAuth do Gmail e da Microsoft estão fora do escopo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sender_name:
                  type: string
                  description: "Nome de exibição do remetente, máximo de 100 caracteres."
                email_from:
                  type: string
                  description: Endereço de e-mail do remetente.
                password:
                  type: string
                  description: Senha ou senha de aplicativo da conta SMTP/IMAP. Armazenada de forma criptografada.
                smtp:
                  type: object
                  description: Objeto com as configurações de SMTP.
                smtp.host:
                  type: string
                  description: "Host SMTP, por exemplo smtp.gmail.com ."
                smtp.port:
                  type: string
                  enum: [25, 465, 587]
                  description: "Porta SMTP. Valores permitidos: 25 , 465 , 587 ."
                smtp.encryption:
                  type: string
                  enum: [ssl, tls, none]
                  description: "Tipo de criptografia. Valores permitidos: ssl , tls , none . Deve corresponder à porta: 465 → ssl , 587 → tls , 25 → none ."
                imap:
                  type: object
                  description: "Objeto com as configurações de IMAP. Opcional, mas se fornecido todos os subcampos são obrigatórios."
                imap.host:
                  type: string
                  description: "Host IMAP, por exemplo imap.gmail.com . Obrigatório quando imap está presente."
                imap.port:
                  type: string
                  enum: [143, 993]
                  description: "Porta IMAP. Valores permitidos: 143 , 993 . Obrigatório quando imap está presente."
                imap.encryption:
                  type: string
                  enum: [ssl, tls, none]
                  description: "Tipo de criptografia. Valores permitidos: ssl , tls , none . Deve corresponder à porta: 993 → ssl ou tls , 143 → none . Obrigatório quando imap está presente."
                reply_to:
                  type: string
                  description: Endereço de e-mail de resposta (reply-to).
                limitation:
                  type: string
                  description: "Limite diário de envios. Inteiro, mín. 1 , máx. 1200 . Padrão: 50 . Não pode exceder a quantidade máxima de e-mails que a conta poderia enviar em 24 horas considerando o delay configurado."
                delay_type:
                  type: string
                  enum: [fixed, random]
                  description: "Tipo de delay entre e-mails. Valores permitidos: fixed , random . Padrão: random ."
                delay_fixed:
                  type: string
                  description: "Delay fixo em segundos (usado quando delay_type=fixed ). Inteiro, mín. 5 , máx. 3600 . Padrão: 600 ."
                delay_from:
                  type: string
                  description: "Delay mínimo em segundos (usado quando delay_type=random ). Inteiro, mín. 5 , máx. 3600 . Padrão: 600 ."
                delay_to:
                  type: string
                  description: "Delay máximo em segundos (usado quando delay_type=random ). Inteiro, mín. 5 , máx. 3600 , deve ser maior que delay_from . Padrão: 900 ."
                signature:
                  type: string
                  description: Assinatura HTML anexada aos e-mails enviados.
                bcc_email:
                  type: string
                  description: Endereço de e-mail BCC.
                tags:
                  type: array
                  items:
                    type: string
                  description: "Array de strings. As tags existentes são associadas pelo nome, e as novas são criadas e vinculadas à conta."
                timezoneId:
                  type: string
                  description: "ID inteiro do fuso horário da conta. Mín. 1 , máx. 458 ."
              required: [sender_name, email_from, password, smtp, smtp.host, smtp.port, smtp.encryption]
      responses:
        200:
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      sender_name:
                        type: string
                      email_from:
                        type: string
                      smtp:
                        type: object
                        properties:
                          host:
                            type: string
                          port:
                            type: integer
                          encryption:
                            type: string
                          status:
                            type: string
                      imap:
                        type: object
                        properties:
                          host:
                            type: string
                          port:
                            type: integer
                          encryption:
                            type: string
                          status:
                            type: string
                      limitation:
                        type: integer
                      delay_type:
                        type: string
                      delay_from:
                        type: integer
                      delay_to:
                        type: integer
                      reply_to:
                        type: string
                      bcc_email:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      created_at:
                        type: string
              example:
                data:
                  id: 869852
                  sender_name: John Smith
                  email_from: "john@example.com"
                  smtp:
                    host: smtp.gmail.com
                    port: 465
                    encryption: ssl
                    status: pending
                  imap:
                    host: imap.gmail.com
                    port: 993
                    encryption: ssl
                    status: pending
                  limitation: 50
                  delay_type: random
                  delay_from: 600
                  delay_to: 900
                  reply_to: "replies@example.com"
                  bcc_email: "bcc@example.com"
                  tags: [Canada campaign 2025]
                  created_at: "2026-03-20T10:00:00+00:00"
